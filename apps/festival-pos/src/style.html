<style>
:root {
  --bg: #f4f5f7;
  --surface: #ffffff;
  --line: #d8dbe0;
  --text: #16181d;
  --muted: #6b7280;
  --primary: #1d4ed8;
  --primary-dark: #1e40af;
  --danger: #b91c1c;
  --ok: #15803d;
  --warn: #b45309;
  --radius: 12px;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

/* .sheet や .diff は display:flex を持つため、UA の [hidden] 指定に勝ってしまう */
[hidden] { display: none !important; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
  font-size: 16px;
  overscroll-behavior: none;
}

button, input { font-family: inherit; font-size: inherit; color: inherit; }

/* ── 画面切り替え ── */
.screen { display: none; flex-direction: column; height: 100%; }
.screen.is-active { display: flex; }

/* ── ログイン ── */
#screen-login { align-items: center; justify-content: center; padding: 16px; overflow-y: auto; }
.login-card {
  width: 100%; max-width: 380px; background: var(--surface);
  border-radius: var(--radius); padding: 24px; border: 1px solid var(--line);
}
.login-title { margin: 0 0 4px; font-size: 24px; }
.login-sub { margin: 0 0 20px; color: var(--muted); font-size: 14px; }
.login-note {
  margin: 16px 0 0; font-size: 12px; line-height: 1.7; color: var(--muted);
  background: #fef3c7; border-radius: 8px; padding: 10px 12px;
}
.login-note strong { color: var(--warn); }

.field { display: block; margin-bottom: 16px; }
.field-label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px; }
.field-label em { font-style: normal; font-weight: 400; color: var(--danger); font-size: 11px; margin-left: 4px; }
.field-label em.opt { color: var(--muted); }
.field input {
  width: 100%; padding: 12px 14px; border: 1px solid var(--line);
  border-radius: 8px; background: #fff; min-height: 48px;
}
.field input:focus, #input-received:focus { outline: 2px solid var(--primary); border-color: var(--primary); }

.error { color: var(--danger); font-size: 13px; margin: 0 0 12px; font-weight: 700; }
.hint { text-align: center; color: var(--muted); font-size: 14px; padding: 16px 8px; margin: 0; }

/* ── ボタン ── */
.btn {
  border: none; border-radius: 10px; padding: 14px 18px; min-height: 52px;
  font-weight: 700; cursor: pointer; background: #e5e7eb;
}
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:active { background: var(--primary-dark); }
.btn-primary:disabled { background: #b6bcc7; }
.btn-ghost { background: var(--surface); border: 1px solid var(--line); }
.btn-block { width: 100%; }
.btn-grow { flex: 1; font-size: 18px; }

.icon-btn {
  border: none; background: transparent; font-size: 22px;
  width: 44px; height: 44px; border-radius: 8px; cursor: pointer;
}

/* ── ヘッダー ── */
.topbar {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px; background: var(--surface); border-bottom: 1px solid var(--line);
  flex-shrink: 0;
}
.topbar-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar-side { display: flex; align-items: center; gap: 6px; }
.shop-name { font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.staff-name { font-size: 12px; color: var(--muted); }

.badge {
  font-size: 11px; font-weight: 700; padding: 4px 8px;
  border-radius: 999px; background: #e5e7eb; white-space: nowrap;
}
.badge-ok { background: #dcfce7; color: var(--ok); }
.badge-pending { background: #fef3c7; color: var(--warn); }
.badge-offline { background: #fee2e2; color: var(--danger); }

.banner {
  background: #fef3c7; color: var(--warn); font-size: 13px; font-weight: 700;
  padding: 10px 14px; border-bottom: 1px solid #fcd34d;
}

/* ── 商品ボタン（味ごとに1枚） ── */
.pos { flex: 1; overflow-y: auto; padding: 12px; -webkit-overflow-scrolling: touch; }

.item-list { display: flex; flex-direction: column; gap: 10px; }
.item-card {
  border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--surface); padding: 10px 10px 12px;
}
.item-name {
  font-size: 15px; font-weight: 700; margin-bottom: 8px;
  display: flex; align-items: center; gap: 8px;
}
.item-keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.key {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px; min-height: 64px; border: 1px solid var(--line); border-radius: 10px;
  background: #f9fafb; cursor: pointer;
}
.key:active { background: #dbeafe; border-color: var(--primary); }
.key-name { font-size: 17px; font-weight: 700; }
.key-price { font-size: 12px; color: var(--muted); }
.key-count {
  position: absolute; top: -6px; right: -6px; min-width: 22px; height: 22px;
  border-radius: 999px; background: var(--primary); color: #fff;
  font-size: 12px; font-weight: 700; display: grid; place-items: center; padding: 0 5px;
}
.key-wrap { position: relative; }

/* ── カート ── */
.cart { list-style: none; margin: 14px 0 0; padding: 0; }
.cart-line {
  display: flex; align-items: center; gap: 8px; padding: 10px 12px;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 10px; margin-bottom: 8px;
}
.cart-name { flex: 1; font-weight: 700; font-size: 14px; min-width: 0; }
.cart-unit { font-size: 12px; color: var(--muted); font-weight: 400; display: block; }
.cart-qty { min-width: 28px; text-align: center; font-weight: 700; }
.cart-amount { min-width: 68px; text-align: right; font-weight: 700; }
.step {
  width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--line);
  background: #f9fafb; font-size: 18px; font-weight: 700; cursor: pointer; flex-shrink: 0;
}

/* ── 会計フッター ── */
.checkout {
  flex-shrink: 0; background: var(--surface); border-top: 1px solid var(--line);
  padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
  display: flex; flex-direction: column; gap: 8px;
}
.total {
  display: flex; align-items: baseline; justify-content: space-between;
  padding: 2px 2px 0;
}
.total-pieces { font-size: 14px; color: var(--muted); }
.total-amount { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; }

.pay-row { display: flex; align-items: center; gap: 8px; }
#input-received {
  width: 108px; flex-shrink: 0; padding: 10px 12px; min-height: 44px;
  border: 1px solid var(--line); border-radius: 8px; background: #fff;
  text-align: right; font-size: 17px; font-weight: 700;
}
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.chip {
  flex: none; min-height: 44px; padding: 0 14px; border: 1px solid var(--line);
  border-radius: 999px; background: #f9fafb; font-size: 14px; cursor: pointer;
  white-space: nowrap;
}
.chip:active { background: #dbeafe; }

.change {
  display: flex; align-items: baseline; justify-content: space-between;
  padding: 8px 12px; background: #eff6ff;
  border: 1px solid #bfdbfe; border-radius: 10px;
}
.change-label { font-size: 13px; font-weight: 700; color: var(--primary-dark); }
.change-amount { font-size: 24px; font-weight: 800; color: var(--primary-dark); }
.change.is-short { background: #fee2e2; border-color: #fecaca; }
.change.is-short .change-label, .change.is-short .change-amount { color: var(--danger); }

.actions { display: flex; gap: 10px; }

/* ── メニュー ── */
.sheet {
  position: fixed; inset: 0; background: rgba(0,0,0,.45);
  display: flex; align-items: flex-end; z-index: 50;
}
.sheet-panel { width: 100%; background: var(--surface); border-radius: 16px 16px 0 0; padding: 8px; }
.sheet-item {
  display: block; width: 100%; padding: 16px; border: none; background: transparent;
  text-align: left; font-size: 16px; border-bottom: 1px solid var(--line); cursor: pointer;
}
.sheet-item:last-child { border-bottom: none; }
.sheet-cancel { color: var(--muted); text-align: center; }

/* ── 履歴 ── */
.history { flex: 1; overflow-y: auto; padding: 12px; }
.history-list { list-style: none; margin: 0; padding: 0; }
.history-item {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 10px; padding: 12px; margin-bottom: 8px;
}
.history-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.history-time { font-size: 12px; color: var(--muted); }
.history-amount { font-size: 20px; font-weight: 800; }
.history-detail { font-size: 13px; color: var(--muted); margin: 4px 0 8px; line-height: 1.6; }
.history-foot { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.history-item.is-void { opacity: .55; }
.history-item.is-void .history-amount { text-decoration: line-through; }
.btn-void {
  border: 1px solid var(--danger); color: var(--danger); background: var(--surface);
  border-radius: 8px; padding: 8px 14px; font-weight: 700; cursor: pointer; min-height: 40px;
}
.tag { font-size: 11px; font-weight: 700; padding: 3px 7px; border-radius: 999px; background: #e5e7eb; }
.tag-pending { background: #fef3c7; color: var(--warn); }
.tag-void { background: #fee2e2; color: var(--danger); }
.tag-stopped { background: #e5e7eb; color: var(--muted); }
.tag-rejected { background: #fee2e2; color: var(--danger); }

/* ── レジ締め ── */
.close-body { flex: 1; overflow-y: auto; padding: 16px; }
.summary { margin: 0 0 18px; }
.summary > div {
  display: flex; justify-content: space-between; padding: 10px 0;
  border-bottom: 1px solid var(--line);
}
.summary dt { color: var(--muted); font-size: 14px; margin: 0; }
.summary dd { margin: 0; font-weight: 700; }
.summary-strong dd { font-size: 20px; }
.diff {
  display: flex; align-items: baseline; justify-content: space-between;
  padding: 12px 16px; background: #eff6ff; border: 1px solid #bfdbfe;
  border-radius: var(--radius); margin-bottom: 16px;
}
.diff.is-bad { background: #fee2e2; border-color: #fecaca; }
.diff.is-bad .change-label, .diff.is-bad .change-amount { color: var(--danger); }

/* ── トースト ── */
.toast {
  position: fixed; left: 50%; bottom: 50%; transform: translate(-50%, 50%);
  background: rgba(22,24,29,.95); color: #fff; padding: 14px 22px;
  border-radius: 999px; font-weight: 700; z-index: 60; max-width: 90%;
  text-align: center; font-size: 15px;
}
.toast.is-big { font-size: 26px; padding: 20px 32px; }

@media (min-width: 640px) {
  .pos, .history, .close-body { max-width: 560px; margin: 0 auto; width: 100%; }
  .checkout > * { max-width: 560px; width: 100%; margin-left: auto; margin-right: auto; }
  .item-list { display: grid; grid-template-columns: 1fr 1fr; }
}
</style>
