<script>
(function () {
  'use strict';

  // ==========================================================
  // 設計メモ
  //   ・会計は端末のローカル保存に即確定させ、画面をすぐ返す（オフラインでも売れる）
  //   ・送信はバックグラウンドで再送。取引 ID で冪等なので二重計上しない
  //   ・商品と価格は「カタログバージョン」で変更を検知し、
  //     売上には会計時の商品名と単価を焼き込む
  // ==========================================================

  var SYNC_INTERVAL_MS = 15000;   // 定期同期の間隔
  var CALL_TIMEOUT_MS = 20000;    // サーバー呼び出しの打ち切り
  var KEY_SESSION = 'pos.session';
  var KEY_CATALOG = 'pos.catalog';
  var KEY_TX_PREFIX = 'pos.tx.';

  var UNITS = ['set3', 'set7', 'single'];
  var UNIT_SHORT = { set3: '3個', set7: '7個', single: 'バラ' };
  var UNIT_LABELS = { set3: '3個セット', set7: '7個セット', single: 'バラ' };
  var UNIT_PIECES = { set3: 3, set7: 7, single: 1 };

  var state = {
    passcode: '',
    staff: '',
    deviceId: '',
    shopName: 'レジ',
    catalog: [],        // [{name, set3, set7, single, active}]
    knownItems: {},     // name -> {set3, set7, single}  過去に見た単価。カートの解決用
    catalogVersion: 0,
    cart: {},           // name -> {set3, set7, single}
    floatAmount: 0,
    startedAt: null,
    online: true,
    syncing: false,
    screen: 'login'
  };

  function $(id) { return document.getElementById(id); }
  function el(tag, className) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    return node;
  }
  function yen(n) { return '¥' + Math.round(Number(n) || 0).toLocaleString('ja-JP'); }
  function uuid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
      var r = Math.random() * 16 | 0;
      return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
    });
  }
  function parseAmount(v) {
    var n = Number(String(v == null ? '' : v).replace(/[^0-9.-]/g, ''));
    return isFinite(n) ? n : 0;
  }
  function timeLabel(iso) {
    var d = new Date(iso);
    return isNaN(d) ? '—' : d.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
  }

  // ==========================================================
  // ローカル保存（localStorage）
  //   取引は 1 件 1 キーにして、会計のたびに全件を書き直さないようにする
  // ==========================================================

  var memoryFallback = {};
  var useMemory = false;

  function lsSet(key, value) {
    if (useMemory) { memoryFallback[key] = value; return true; }
    try {
      localStorage.setItem(key, JSON.stringify(value));
      return true;
    } catch (err) {
      // 容量超過やプライベートブラウジング。メモリに退避して警告する
      useMemory = true;
      memoryFallback[key] = value;
      toast('端末に保存できません。タブを閉じると会計が消えます', 6000);
      return false;
    }
  }
  function lsGet(key) {
    if (useMemory) return memoryFallback[key] || null;
    try {
      var raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : null;
    } catch (err) { return null; }
  }
  function lsKeys(prefix) {
    if (useMemory) {
      return Object.keys(memoryFallback).filter(function (k) { return k.indexOf(prefix) === 0; });
    }
    var out = [];
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (k && k.indexOf(prefix) === 0) out.push(k);
      }
    } catch (err) { /* noop */ }
    return out;
  }

  function saveTx(rec) { lsSet(KEY_TX_PREFIX + rec.id, rec); }
  function getTx(id) { return lsGet(KEY_TX_PREFIX + id); }
  function allTx() {
    return lsKeys(KEY_TX_PREFIX)
      .map(lsGet)
      .filter(Boolean)
      .sort(function (a, b) { return String(b.clientTime).localeCompare(String(a.clientTime)); });
  }
  function pendingTx() {
    return allTx().filter(function (t) { return !t.synced && !t.rejected; });
  }

  // ==========================================================
  // サーバー呼び出し
  // ==========================================================

  function callServer(fnName, args) {
    return new Promise(function (resolve, reject) {
      var settled = false;
      var timer = setTimeout(function () {
        if (!settled) { settled = true; reject(new Error('timeout')); }
      }, CALL_TIMEOUT_MS);

      function done(fn) {
        return function (value) {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          fn(value);
        };
      }
      try {
        var runner = google.script.run
          .withSuccessHandler(done(resolve))
          .withFailureHandler(done(reject));
        runner[fnName].apply(runner, args);
      } catch (err) {
        done(reject)(err);
      }
    });
  }

  // ==========================================================
  // 商品カタログ
  // ==========================================================

  function applyCatalog(catalog, version) {
    if (!Array.isArray(catalog)) return;
    var changed = Number(version) !== Number(state.catalogVersion);

    state.catalog = catalog.map(function (item) {
      return {
        name: String(item.name || ''),
        set3: Number(item.set3) || 0,
        set7: Number(item.set7) || 0,
        single: Number(item.single) || 0,
        active: item.active !== false
      };
    }).filter(function (item) { return item.name; });

    // 会計途中のカートが解決できなくならないよう、一度見た単価は覚えておく
    state.catalog.forEach(function (item) {
      state.knownItems[item.name] = { set3: item.set3, set7: item.set7, single: item.single };
    });

    state.catalogVersion = Number(version) || 0;
    lsSet(KEY_CATALOG, {
      catalog: state.catalog,
      catalogVersion: state.catalogVersion,
      knownItems: state.knownItems
    });

    if (!changed) return;
    renderItems();
    renderCart();
    if (state.screen !== 'pos') return;

    var banner = $('catalog-banner');
    banner.textContent = cartHasMissingItem()
      ? '商品・価格が変更されました。カートに販売停止の商品が残っています。'
      : '商品・価格が変更されました。カートを新しい価格で計算し直しました。';
    banner.hidden = false;
    setTimeout(function () { banner.hidden = true; }, 8000);
  }

  function itemByName(name) {
    for (var i = 0; i < state.catalog.length; i++) {
      if (state.catalog[i].name === name) return state.catalog[i];
    }
    return null;
  }

  /** 現在の単価。カタログから消えた商品は最後に見た単価で計算する */
  function priceOf(name) {
    var item = itemByName(name);
    if (item) return { set3: item.set3, set7: item.set7, single: item.single };
    var known = state.knownItems[name];
    return known || { set3: 0, set7: 0, single: 0 };
  }

  function isSellable(name) {
    var item = itemByName(name);
    return Boolean(item && item.active);
  }

  // ==========================================================
  // カート
  // ==========================================================

  function cartQty(name, unit) {
    return (state.cart[name] && state.cart[name][unit]) || 0;
  }

  function addToCart(name, unit, count) {
    if (!state.cart[name]) state.cart[name] = { set3: 0, set7: 0, single: 0 };
    state.cart[name][unit] = Math.max(0, state.cart[name][unit] + (count || 1));
    if (UNITS.every(function (u) { return state.cart[name][u] === 0; })) delete state.cart[name];
    renderItems();
    renderCart();
  }

  /** 会計に送る明細。商品 × 区分で 1 行 */
  function cartLines() {
    var lines = [];
    Object.keys(state.cart).forEach(function (name) {
      var prices = priceOf(name);
      UNITS.forEach(function (unit) {
        var qty = state.cart[name][unit];
        if (qty > 0) lines.push({ item: name, unit: unit, qty: qty, unitPrice: prices[unit] });
      });
    });
    return lines;
  }

  function cartTotal() {
    return cartLines().reduce(function (sum, l) { return sum + l.qty * l.unitPrice; }, 0);
  }
  function cartPieces() {
    return cartLines().reduce(function (sum, l) { return sum + l.qty * UNIT_PIECES[l.unit]; }, 0);
  }
  function cartIsEmpty() { return Object.keys(state.cart).length === 0; }
  function cartHasMissingItem() {
    return Object.keys(state.cart).some(function (name) { return !isSellable(name); });
  }

  function clearCart() {
    state.cart = {};
    $('input-received').value = '';
    renderItems();
    renderCart();
  }

  // ==========================================================
  // 会計
  // ==========================================================

  function checkout() {
    var lines = cartLines();
    if (lines.length === 0) return;
    var total = cartTotal();
    if (total <= 0) { toast('価格が読み込めていません'); return; }

    var rawReceived = $('input-received').value.trim();
    var received = rawReceived === '' ? total : parseAmount(rawReceived);
    if (received < total) {
      toast('お預かりが不足しています');
      return;
    }

    var rec = {
      id: uuid(),
      deviceId: state.deviceId,
      staff: state.staff,
      clientTime: new Date().toISOString(),
      kind: 'sale',
      voidOf: null,
      lines: lines,
      catalogVersion: state.catalogVersion,
      total: total,
      received: received,
      change: received - total,
      note: '',
      synced: false,
      voided: false,
      rejected: false
    };
    saveTx(rec);
    clearCart();
    renderSyncBadge();

    var change = rec.change;
    toast(change > 0 ? 'おつり ' + yen(change) : 'ちょうど ' + yen(total), 2600, true);
    sync();
  }

  function voidTransaction(original) {
    if (!original || original.voided || original.kind !== 'sale') return;
    var rec = {
      id: uuid(),
      deviceId: state.deviceId,
      staff: state.staff,
      clientTime: new Date().toISOString(),
      kind: 'void',
      voidOf: original.id,
      // 取り消すのは「そのときの価格の売上」なので、元の明細をそのまま使う
      lines: original.lines,
      catalogVersion: original.catalogVersion,
      total: original.total,
      received: null,
      change: null,
      note: '',
      synced: false,
      voided: false,
      rejected: false
    };
    saveTx(rec);

    var updated = getTx(original.id) || original;
    updated.voided = true;
    saveTx(updated);

    renderHistory();
    renderSyncBadge();
    toast('取り消しました（' + yen(original.total) + '）');
    sync();
  }

  // ==========================================================
  // 同期
  // ==========================================================

  function toPayload(t) {
    return {
      id: t.id, deviceId: t.deviceId, staff: t.staff, clientTime: t.clientTime,
      kind: t.kind, voidOf: t.voidOf, lines: t.lines,
      catalogVersion: t.catalogVersion, total: t.total,
      received: t.received, change: t.change, note: t.note
    };
  }

  function sync() {
    if (state.syncing) return Promise.resolve();
    state.syncing = true;
    renderSyncBadge();

    var batch = pendingTx().map(toPayload);
    return callServer('apiSyncTransactions', [state.passcode, batch])
      .then(function (res) {
        if (!res || !res.ok) throw new Error((res && res.error) || '同期に失敗しました');
        (res.acceptedIds || []).forEach(function (id) {
          var t = getTx(id);
          if (t) { t.synced = true; saveTx(t); }
        });
        (res.rejected || []).forEach(function (item) {
          var t = getTx(item && item.id);
          if (!t) return;
          // 受理されなかったものを送り続けても通らないので、印を付けて履歴に残す
          t.rejected = true;
          t.rejectReason = String(item.reason || '');
          saveTx(t);
          toast('記録できなかった会計があります（履歴を確認してください）', 5000);
        });
        state.online = true;
        applyCatalog(res.catalog, res.catalogVersion);
      })
      .catch(function () {
        // 失敗しても未送信のまま端末に残るので、次の同期で再送される
        state.online = false;
      })
      .then(function () {
        state.syncing = false;
        renderSyncBadge();
        if (state.screen === 'history') renderHistory();
      });
  }

  // ==========================================================
  // 描画
  // ==========================================================

  function showScreen(name) {
    state.screen = name;
    ['login', 'pos', 'history', 'close'].forEach(function (s) {
      var node = $('screen-' + s);
      if (node) node.classList.toggle('is-active', s === name);
    });
    if (name === 'history') renderHistory();
    if (name === 'close') renderClose();
  }

  function renderItems() {
    var host = $('item-list');
    host.replaceChildren();
    $('item-empty').hidden = state.catalog.length > 0;

    state.catalog.filter(function (item) { return item.active; }).forEach(function (item) {
      var card = el('div', 'item-card');
      var name = el('div', 'item-name');
      name.textContent = item.name;
      card.appendChild(name);

      var keys = el('div', 'item-keys');
      UNITS.forEach(function (unit) {
        var qty = cartQty(item.name, unit);
        var button = el('button', 'key');
        button.type = 'button';
        button.dataset.item = item.name;
        button.dataset.unit = unit;
        // 選んだボタン自体の色を変える。個数バッジだけだとどのボタンの数か読み取りにくい
        if (qty > 0) button.classList.add('is-selected');

        var label = el('span', 'key-name');
        label.textContent = UNIT_SHORT[unit];
        var price = el('span', 'key-price');
        price.textContent = yen(item[unit]) + (unit === 'single' ? ' /個' : '');
        button.append(label, price);

        // 個数はボタンの内側に入れる。外に出すと隣のボタンの数に見えてしまう
        if (qty > 0) {
          var badge = el('span', 'key-count');
          badge.textContent = qty;
          badge.setAttribute('aria-label', UNIT_LABELS[unit] + ' ' + qty + '点');
          button.appendChild(badge);
        }
        keys.appendChild(button);
      });
      card.appendChild(keys);
      host.appendChild(card);
    });
  }

  function renderCart() {
    var list = $('cart');
    list.replaceChildren();
    var lines = cartLines();
    $('cart-empty').hidden = lines.length > 0;

    lines.forEach(function (line) {
      var li = el('li', 'cart-line');

      var name = el('span', 'cart-name');
      name.textContent = line.item;
      if (!isSellable(line.item)) {
        var tag = el('span', 'tag tag-stopped');
        tag.textContent = '販売停止';
        name.append(' ', tag);
      }
      var unit = el('span', 'cart-unit');
      unit.textContent = UNIT_LABELS[line.unit] + '  ' + yen(line.unitPrice) + ' × ' + line.qty;
      name.appendChild(unit);
      li.appendChild(name);

      [['-1', '−', '減らす'], ['1', '＋', '増やす']].forEach(function (spec, index) {
        var button = el('button', 'step');
        button.type = 'button';
        button.dataset.item = line.item;
        button.dataset.unit = line.unit;
        button.dataset.step = spec[0];
        button.textContent = spec[1];
        button.setAttribute('aria-label', line.item + ' ' + UNIT_LABELS[line.unit] + 'を' + spec[2]);
        if (index === 0) {
          li.appendChild(button);
          var qty = el('span', 'cart-qty');
          qty.textContent = line.qty;
          li.appendChild(qty);
        } else {
          li.appendChild(button);
        }
      });

      var amount = el('span', 'cart-amount');
      amount.textContent = yen(line.qty * line.unitPrice);
      li.appendChild(amount);

      list.appendChild(li);
    });

    var total = cartTotal();
    $('total-pieces').textContent = cartPieces() + '個';
    $('total-amount').textContent = yen(total);
    renderChange();
    $('btn-checkout').disabled = lines.length === 0 || total <= 0;
  }

  function renderChange() {
    var total = cartTotal();
    var raw = $('input-received').value.trim();
    var received = raw === '' ? total : parseAmount(raw);
    var change = received - total;
    var box = document.querySelector('.change');
    var short = raw !== '' && change < 0;
    box.classList.toggle('is-short', short);
    $('change-amount').textContent = short ? '不足 ' + yen(-change) : yen(Math.max(0, change));
  }

  function renderSyncBadge() {
    var badge = $('sync-badge');
    var n = pendingTx().length;
    if (state.syncing) {
      badge.className = 'badge'; badge.textContent = '同期中…';
    } else if (n > 0) {
      badge.className = 'badge ' + (state.online ? 'badge-pending' : 'badge-offline');
      badge.textContent = (state.online ? '未送信 ' : 'オフライン ') + n;
    } else if (!state.online) {
      badge.className = 'badge badge-offline'; badge.textContent = 'オフライン';
    } else {
      badge.className = 'badge badge-ok'; badge.textContent = '同期済';
    }
  }

  function describeLines(lines) {
    return (lines || []).map(function (l) {
      return l.item + ' ' + UNIT_LABELS[l.unit] + '×' + l.qty;
    }).join(' / ');
  }

  function renderHistory() {
    var list = $('history-list');
    var items = allTx().filter(function (t) { return t.kind === 'sale'; });
    list.replaceChildren();
    $('history-empty').hidden = items.length > 0;
    $('history-count').textContent = items.length + '件';

    items.forEach(function (t) {
      var li = el('li', 'history-item' + (t.voided ? ' is-void' : ''));

      var head = el('div', 'history-head');
      var time = el('span', 'history-time');
      time.textContent = timeLabel(t.clientTime) + ' ・ ' + (t.staff || '');
      var amount = el('span', 'history-amount');
      amount.textContent = yen(t.total);
      head.append(time, amount);
      li.appendChild(head);

      var detail = el('p', 'history-detail');
      detail.textContent = describeLines(t.lines);
      li.appendChild(detail);

      var foot = el('div', 'history-foot');
      if (t.voided) {
        var voidTag = el('span', 'tag tag-void');
        voidTag.textContent = '取消済';
        foot.appendChild(voidTag);
      }
      if (t.rejected) {
        var rejectTag = el('span', 'tag tag-rejected');
        rejectTag.textContent = '記録失敗: ' + (t.rejectReason || '');
        foot.appendChild(rejectTag);
      } else if (!t.synced) {
        var pendingTag = el('span', 'tag tag-pending');
        pendingTag.textContent = '未送信';
        foot.appendChild(pendingTag);
      }
      if (!t.voided) {
        var button = el('button', 'btn-void');
        button.type = 'button';
        button.dataset.void = t.id;
        button.textContent = 'この会計を取り消す';
        foot.appendChild(button);
      }
      li.appendChild(foot);

      list.appendChild(li);
    });
  }

  function shiftTransactions() {
    var from = state.startedAt ? new Date(state.startedAt).getTime() : 0;
    return allTx().filter(function (t) {
      return t.staff === state.staff && new Date(t.clientTime).getTime() >= from;
    });
  }

  function shiftCashSales() {
    return shiftTransactions().reduce(function (sum, t) {
      if (t.rejected) return sum;
      return sum + (t.kind === 'void' ? -t.total : t.total);
    }, 0);
  }

  function renderClose() {
    var txs = shiftTransactions();
    var sales = shiftCashSales();
    var expected = state.floatAmount + sales;

    $('close-staff').textContent = state.staff || '—';
    $('close-started').textContent = state.startedAt ? timeLabel(state.startedAt) : '—';
    $('close-count').textContent = txs.filter(function (t) {
      return t.kind === 'sale' && !t.voided && !t.rejected;
    }).length + '件';
    $('close-sales').textContent = yen(sales);
    $('close-float').textContent = yen(state.floatAmount);
    $('close-expected').textContent = yen(expected);
    renderCloseDiff();
  }

  function renderCloseDiff() {
    var raw = $('input-counted').value.trim();
    var box = $('close-diff-box');
    if (raw === '') { box.hidden = true; return; }
    var expected = state.floatAmount + shiftCashSales();
    var diff = parseAmount(raw) - expected;
    box.hidden = false;
    box.classList.toggle('is-bad', diff !== 0);
    $('close-diff').textContent = (diff > 0 ? '+' : '') + yen(diff);
  }

  var toastTimer = null;
  function toast(message, ms, big) {
    var node = $('toast');
    node.textContent = message;
    node.classList.toggle('is-big', !!big);
    node.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { node.hidden = true; }, ms || 2200);
  }

  // ==========================================================
  // 画面スリープ防止
  // ==========================================================

  var wakeLock = null;
  function requestWakeLock() {
    if (!navigator.wakeLock) return;
    navigator.wakeLock.request('screen').then(function (lock) {
      wakeLock = lock;
      lock.addEventListener('release', function () { wakeLock = null; });
    }).catch(function () { /* 環境によっては使えない。致命的ではない */ });
  }

  // ==========================================================
  // イベント
  // ==========================================================

  function bindEvents() {
    $('btn-login').addEventListener('click', login);
    $('input-passcode').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') login();
    });

    $('item-list').addEventListener('click', function (e) {
      var button = e.target.closest('[data-unit]');
      if (!button) return;
      addToCart(button.dataset.item, button.dataset.unit, 1);
    });

    $('cart').addEventListener('click', function (e) {
      var button = e.target.closest('[data-step]');
      if (!button) return;
      addToCart(button.dataset.item, button.dataset.unit, Number(button.dataset.step));
    });

    document.querySelectorAll('[data-received]').forEach(function (button) {
      button.addEventListener('click', function () {
        var v = button.dataset.received;
        $('input-received').value = v === 'exact' ? String(cartTotal()) : v;
        renderChange();
      });
    });

    $('input-received').addEventListener('input', renderChange);
    $('btn-checkout').addEventListener('click', checkout);
    $('btn-clear').addEventListener('click', clearCart);

    $('btn-menu').addEventListener('click', function () { $('menu-sheet').hidden = false; });
    $('menu-sheet').addEventListener('click', function (e) {
      if (e.target.id === 'menu-sheet') { $('menu-sheet').hidden = true; return; }
      var button = e.target.closest('[data-menu]');
      if (!button) return;
      $('menu-sheet').hidden = true;
      handleMenu(button.dataset.menu);
    });

    document.querySelectorAll('[data-back]').forEach(function (button) {
      button.addEventListener('click', function () { showScreen(button.dataset.back); });
    });

    $('history-list').addEventListener('click', function (e) {
      var button = e.target.closest('[data-void]');
      if (!button) return;
      var t = getTx(button.dataset.void);
      if (!t) return;
      if (confirm(yen(t.total) + ' の会計を取り消します。よろしいですか？')) voidTransaction(t);
    });

    $('input-counted').addEventListener('input', renderCloseDiff);
    $('btn-close-register').addEventListener('click', closeRegister);

    window.addEventListener('online', function () { state.online = true; sync(); });
    window.addEventListener('offline', function () { state.online = false; renderSyncBadge(); });
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) { requestWakeLock(); sync(); }
    });
  }

  function handleMenu(action) {
    if (action === 'history') showScreen('history');
    else if (action === 'close') showScreen('close');
    else if (action === 'sync') {
      sync().then(function () {
        toast(state.online ? '同期しました' : 'サーバーに接続できません');
      });
    } else if (action === 'staff') {
      var pending = pendingTx().length;
      if (pending > 0 && !confirm('未送信の会計が ' + pending + ' 件あります。交代してもこの端末に残り、再送されます。続けますか？')) return;
      showScreen('login');
      $('input-staff').value = '';
      $('input-staff').focus();
    }
  }

  function login() {
    var staff = $('input-staff').value.trim();
    var passcode = $('input-passcode').value.trim();
    var err = $('login-error');

    if (!staff) { err.textContent = '担当者名を入力してください'; err.hidden = false; return; }
    if (!passcode) { err.textContent = 'パスコードを入力してください'; err.hidden = false; return; }

    err.hidden = true;
    $('btn-login').disabled = true;
    $('btn-login').textContent = '確認中…';

    callServer('apiBootstrap', [passcode])
      .then(function (res) {
        if (!res || !res.ok) throw new Error((res && res.error) || '接続できませんでした');
        state.passcode = passcode;
        state.staff = staff;
        state.shopName = res.shopName;
        state.floatAmount = parseAmount($('input-float').value);
        state.startedAt = new Date().toISOString();
        state.online = true;

        lsSet(KEY_SESSION, {
          passcode: passcode, staff: staff, deviceId: state.deviceId,
          shopName: res.shopName, floatAmount: state.floatAmount, startedAt: state.startedAt
        });

        $('shop-name').textContent = state.shopName;
        $('staff-name').textContent = '担当: ' + state.staff;
        // 画面を切り替える前にカタログを入れる。初回は必ず版数が変わるので、
        // ここで入れておかないと「変更されました」のバナーが毎回出てしまう
        applyCatalog(res.catalog, res.catalogVersion);
        renderItems();
        renderCart();
        renderSyncBadge();
        showScreen('pos');
        requestWakeLock();
        sync();
      })
      .catch(function (e) {
        err.textContent = e && e.message === 'timeout'
          ? 'サーバーに接続できません。電波を確認してください'
          : (e && e.message) || 'パスコードが違います';
        err.hidden = false;
      })
      .then(function () {
        $('btn-login').disabled = false;
        $('btn-login').textContent = 'レジを開く';
      });
  }

  function closeRegister() {
    var err = $('close-error');
    var raw = $('input-counted').value.trim();
    if (raw === '') {
      err.textContent = '実際に数えた現金を入力してください';
      err.hidden = false;
      return;
    }
    var pending = pendingTx().length;
    if (pending > 0) {
      err.textContent = '未送信の会計が ' + pending + ' 件あります。「いますぐ同期」を実行してください';
      err.hidden = false;
      return;
    }
    err.hidden = true;

    var button = $('btn-close-register');
    button.disabled = true;
    button.textContent = '記録中…';

    callServer('apiCloseRegister', [state.passcode, {
      staff: state.staff,
      deviceId: state.deviceId,
      startedAt: state.startedAt,
      floatAmount: state.floatAmount,
      cashSales: shiftCashSales(),
      countedCash: parseAmount(raw),
      txCount: shiftTransactions().filter(function (t) {
        return t.kind === 'sale' && !t.voided && !t.rejected;
      }).length,
      note: $('input-close-note').value.trim()
    }])
      .then(function (res) {
        if (!res || !res.ok) throw new Error((res && res.error) || '記録できませんでした');
        var diff = res.difference;
        toast(diff === 0 ? 'ぴったりです。お疲れさまでした' : '差額 ' + (diff > 0 ? '+' : '') + yen(diff) + ' を記録しました', 4000);
        showScreen('pos');
      })
      .catch(function (e) {
        err.textContent = (e && e.message === 'timeout') ? 'サーバーに接続できません' : (e && e.message) || '記録できませんでした';
        err.hidden = false;
      })
      .then(function () {
        button.disabled = false;
        button.textContent = 'レジ締めを記録する';
      });
  }

  // ==========================================================
  // 起動
  // ==========================================================

  function boot() {
    var session = lsGet(KEY_SESSION) || {};
    state.deviceId = session.deviceId || uuid().slice(0, 8);

    var cached = lsGet(KEY_CATALOG);
    if (cached) {
      state.catalog = cached.catalog || [];
      state.catalogVersion = cached.catalogVersion || 0;
      state.knownItems = cached.knownItems || {};
    }

    bindEvents();

    // 直前のシフトを復元する（リロードしても未送信の会計は残っている）
    if (session.passcode && session.staff) {
      state.passcode = session.passcode;
      state.staff = session.staff;
      state.shopName = session.shopName || 'レジ';
      state.floatAmount = session.floatAmount || 0;
      state.startedAt = session.startedAt || new Date().toISOString();
      $('shop-name').textContent = state.shopName;
      $('staff-name').textContent = '担当: ' + state.staff;
      renderItems();
      renderCart();
      renderSyncBadge();
      showScreen('pos');
      requestWakeLock();
      sync();
    } else {
      showScreen('login');
      $('input-staff').focus();
    }

    setInterval(sync, SYNC_INTERVAL_MS);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
